apiVersion: apps/v1

kind: Deployment

metadata:
  name: thomson-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thomson

  template:
    metadata:
      labels:
        app: thomson 
    spec:
      containers:
        - name: thomson-container
          image: thomson-portfolio-v1:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
  